# Disposable H1 fixtures only, never the persistent workbench. Run it through scripts/disposable_db.py,
# which checks the target first. Images are already local and pinned by digest, so nothing is pulled.
# These are not the coordinated self-hosted release that US-2.1 pins.
name: ${AUTOBOTS_DISPOSABLE_PROJECT:?required}

x-labels: &labels
  autobots.target: disposable
  autobots.run: ${AUTOBOTS_DISPOSABLE_PROJECT:?required}

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.106@sha256:21ab971149317ea9cd12a8126fe4ebb34def08c8972956b0958cba0924409dab
    pull_policy: never
    labels: *labels
    environment:
      POSTGRES_PASSWORD: ${AUTOBOTS_DISPOSABLE_PASSWORD:?required}
      PGPASSWORD: ${AUTOBOTS_DISPOSABLE_PASSWORD:?required}
      JWT_SECRET: ${AUTOBOTS_DISPOSABLE_JWT_SECRET:?required}
      JWT_EXP: "3600"
    ports:
      - "127.0.0.1:${AUTOBOTS_DISPOSABLE_DB_PORT:?required}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 60

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.35.3@sha256:5a3ecdc67dbe9e88a56810b5b2f432f2d93708dcb4dc9de34e78e342b390eb4d
    pull_policy: never
    labels: *labels
    profiles: [storage]
    environment:
      AUTH_JWT_SECRET: ${AUTOBOTS_DISPOSABLE_JWT_SECRET:?required}
      PGRST_JWT_SECRET: ${AUTOBOTS_DISPOSABLE_JWT_SECRET:?required}
      ANON_KEY: ${AUTOBOTS_DISPOSABLE_ANON_KEY:?required}
      SERVICE_KEY: ${AUTOBOTS_DISPOSABLE_SERVICE_KEY:?required}
      POSTGREST_URL: http://unused.invalid
      DATABASE_URL: postgres://supabase_storage_admin:${AUTOBOTS_DISPOSABLE_PASSWORD:?required}@db:5432/postgres
      FILE_SIZE_LIMIT: "1048576"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: disposable
      REGION: local
      GLOBAL_S3_BUCKET: disposable
      ENABLE_IMAGE_TRANSFORMATION: "false"
    ports:
      - "127.0.0.1:${AUTOBOTS_DISPOSABLE_STORAGE_PORT:?required}:5000"
    volumes:
      - storage:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
    labels: *labels
  storage:
    labels: *labels
