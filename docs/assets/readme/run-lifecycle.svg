<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">How a run works</title>
  <desc id="desc">Five stages from left to right. Set a goal: the goal, Expert, model and budget, from the Studio. Admission: budget reserved, model bound, tools granted, with a retry-safe receipt. Worker claims: leased, fenced, checkpointed, survives restarts. Agent loop: plan, act and observe, each call metered through OpenRouter, and writes wait for an approval. Checked result: checks recorded, plan completed, artifacts saved. Postgres underneath holds checkpoints, events, receipts and budgets, and the Studio streams the run live.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #0a0a0a; --mfg: #737373; --line: #e5e5e5; --surface: #f5f5f5; --brand: #155dfc; --deep: #1447e6; --on: #eff6ff; --ok: #009966; --att: #a05000; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #171717; --fg: #fafafa; --mfg: #a1a1a1; --line: #333333; --surface: #262626; --brand: #2b7fff; --deep: #193cb8; --ok: #00bc7d; --att: #ffb900; }
    }
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .frame { fill: var(--bg); stroke: var(--line); }
    .card { fill: var(--bg); stroke: var(--line); }
    .loop { fill: var(--bg); stroke: var(--brand); stroke-width: 1.5; }
    .appr { fill: var(--bg); stroke: var(--att); stroke-width: 1.5; }
    .band { fill: var(--surface); }
    .badge { fill: var(--deep); } .on { fill: var(--on); }
    .fg { fill: var(--fg); } .mfg { fill: var(--mfg); } .ok { fill: var(--ok); } .att { fill: var(--att); } .brandf { fill: var(--brand); }
    .title { font-size: 15px; font-weight: 600; fill: var(--fg); }
    .line { font-size: 12.5px; fill: var(--mfg); }
    .arrow { fill: none; stroke: var(--mfg); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .tie { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 2 4; }
    .tie-att { fill: none; stroke: var(--att); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .head { fill: var(--mfg); }
    .icon { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-mfg { fill: none; stroke: var(--mfg); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-reduced-motion: no-preference) {
      .arrow { animation: flow 1.2s linear infinite; }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
    }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @keyframes pulse { 50% { opacity: 0.3; } }
  </style>

  <rect class="frame" x="0.5" y="0.5" width="959" height="439" rx="16"/>

  <!-- OpenRouter, above the loop -->
  <rect class="card" x="553" y="16" width="230" height="36" rx="18"/>
  <circle class="brandf" cx="575" cy="34" r="4"/>
  <text class="fg" x="587" y="39" font-size="13" font-weight="600">OpenRouter</text>
  <text class="mfg mono" x="767" y="38" font-size="10.5" text-anchor="end">Terra · Sol</text>
  <path class="tie" d="M668 52 V72"/>

  <!-- Stages -->
  <g>
    <rect class="card" x="24" y="72" width="160" height="160" rx="14"/>
    <circle class="badge" cx="54" cy="102" r="12"/><text class="on" x="54" y="106.5" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text class="title" x="42" y="142">Set a goal</text>
    <text class="line" x="42" y="168">Goal, Expert,</text>
    <text class="line" x="42" y="188">model and budget,</text>
    <text class="line" x="42" y="208">from the Studio</text>
  </g>
  <g>
    <rect class="card" x="212" y="72" width="160" height="160" rx="14"/>
    <circle class="badge" cx="242" cy="102" r="12"/><text class="on" x="242" y="106.5" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text class="title" x="230" y="142">Admission</text>
    <text class="line" x="230" y="168">Budget reserved</text>
    <text class="line" x="230" y="188">Model bound</text>
    <text class="line" x="230" y="208">Retry-safe receipt</text>
  </g>
  <g>
    <rect class="card" x="400" y="72" width="160" height="160" rx="14"/>
    <circle class="badge" cx="430" cy="102" r="12"/><text class="on" x="430" y="106.5" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text class="title" x="418" y="142">Worker claims</text>
    <text class="line" x="418" y="168">Leased and fenced</text>
    <text class="line" x="418" y="188">Checkpointed</text>
    <text class="line" x="418" y="208">Survives restarts</text>
  </g>
  <g>
    <rect class="loop" x="588" y="72" width="160" height="160" rx="14"/>
    <circle class="badge" cx="618" cy="102" r="12"/><text class="on" x="618" y="106.5" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <g class="icon" transform="translate(712 90)"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></g>
    <text class="title" x="606" y="142">Agent loop</text>
    <text class="line" x="606" y="168">Plan, act, observe</text>
    <text class="line" x="606" y="188">Every call metered</text>
    <text class="line" x="606" y="208">Writes wait for you</text>
  </g>
  <g>
    <rect class="card" x="776" y="72" width="160" height="160" rx="14"/>
    <circle class="ok" cx="806" cy="102" r="12"/>
    <path d="M800.5 102.5 l3.5 3.5 l7 -7.3" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="title" x="794" y="142">Checked result</text>
    <text class="line" x="794" y="168">Checks recorded</text>
    <text class="line" x="794" y="188">Plan completed</text>
    <text class="line" x="794" y="208">Artifacts saved</text>
  </g>

  <!-- Flow between stages -->
  <path class="arrow" d="M184 152 H206"/><path class="head" d="M212 152 l-7 -4 v8 z"/>
  <path class="arrow" d="M372 152 H394"/><path class="head" d="M400 152 l-7 -4 v8 z"/>
  <path class="arrow" d="M560 152 H582"/><path class="head" d="M588 152 l-7 -4 v8 z"/>
  <path class="arrow" d="M748 152 H770"/><path class="head" d="M776 152 l-7 -4 v8 z"/>

  <!-- Approval, under the loop -->
  <path class="tie-att" d="M668 232 V280"/>
  <rect class="appr" x="588" y="280" width="160" height="64" rx="12"/>
  <circle class="att pulse" cx="610" cy="312" r="6"/>
  <text class="fg" x="626" y="307" font-size="14" font-weight="600">Approval</text>
  <text class="mfg" x="626" y="326" font-size="12">waits for you</text>

  <!-- Live in the Studio -->
  <rect class="card" x="24" y="376" width="160" height="40" rx="20"/>
  <circle class="ok pulse" cx="46" cy="396" r="5"/>
  <text class="fg" x="60" y="400.5" font-size="12.5" font-weight="600">Live in the Studio</text>

  <!-- Postgres underneath -->
  <path class="tie" d="M292 232 V376"/>
  <path class="tie" d="M480 232 V376"/>
  <path class="tie" d="M668 344 V376"/>
  <path class="tie" d="M856 232 V376"/>
  <path class="tie" d="M184 396 H212"/>
  <rect class="band" x="212" y="376" width="724" height="40" rx="12"/>
  <g class="icon-mfg" transform="translate(228 384)"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
  <text class="fg" x="262" y="400.5" font-size="13" font-weight="600">Postgres</text>
  <text class="mfg" x="330" y="400.5" font-size="12.5">checkpoints · events · receipts · budgets · approvals</text>
</svg>
