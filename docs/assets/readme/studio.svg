<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">The Autobots Studio, illustrated</title>
  <desc id="desc">An illustration of the Studio in its default dark theme. The sidebar holds New run, Search and three groups: Work (Home, Runs, Approvals with one waiting), Build (Experts, Workflows, Tools) and System (Operations, Models, Settings). The run page shows a run waiting for approval, its result text streaming in, its plan with two steps done, and the pull request waiting to be approved or declined.</desc>
  <!-- Always dark: the Studio opens dark on first use (PRD-Design-System DS-02). Colors are the Luma dark tokens. -->
  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .nav { fill: #e5e5e5; font-size: 13.5px; }
    .group { fill: #737373; font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      .caret { animation: blink 1s steps(1) infinite; }
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="959" height="559" rx="16" fill="#0a0a0a" stroke="#2e2e2e"/>
  <!-- Window bar -->
  <path d="M16.5 0.5 H943.5 A16 16 0 0 1 959.5 16.5 V36 H0.5 V16.5 A16 16 0 0 1 16.5 0.5 Z" fill="#171717"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="38" cy="18" r="6" fill="#febc2e"/><circle cx="56" cy="18" r="6" fill="#28c840"/>
  <rect x="330" y="8" width="300" height="20" rx="10" fill="#0a0a0a"/>
  <text class="mono" x="480" y="22" font-size="11" fill="#a1a1a1" text-anchor="middle">127.0.0.1:3000/runs</text>

  <!-- Sidebar -->
  <path d="M0.5 36 H220 V559.5 H16.5 A16 16 0 0 1 0.5 543.5 Z" fill="#171717"/>
  <line x1="220" y1="36" x2="220" y2="560" stroke="#262626"/>
  <rect x="20" y="54" width="24" height="24" rx="6" fill="#2b7fff"/>
  <g transform="translate(24 58) scale(0.6667)" fill="none" stroke="#eff6ff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
  </g>
  <text class="serif" x="54" y="73" font-size="19" fill="#fafafa">Autobots</text>

  <rect x="16" y="94" width="188" height="32" rx="8" fill="#193cb8"/>
  <text x="32" y="115" font-size="13" font-weight="600" fill="#eff6ff">New run</text>
  <text class="mono" x="192" y="115" font-size="11" fill="#eff6ff" fill-opacity="0.7" text-anchor="end">⇧⌘O</text>
  <rect x="16.5" y="134.5" width="187" height="31" rx="8" fill="#0a0a0a" stroke="#2e2e2e"/>
  <text x="32" y="155" font-size="13" fill="#a1a1a1">Search</text>
  <text class="mono" x="192" y="155" font-size="11" fill="#737373" text-anchor="end">⌘K</text>

  <text class="group" x="24" y="196">WORK</text>
  <text class="nav" x="28" y="222">Home</text>
  <rect x="12" y="232" width="196" height="28" rx="6" fill="#262626"/>
  <text class="nav" x="28" y="251" fill="#fafafa" font-weight="600">Runs</text>
  <text class="nav" x="28" y="280">Approvals</text>
  <circle cx="190" cy="275" r="9" fill="#ffb900"/><text x="190" y="279" font-size="11" font-weight="700" fill="#1e170e" text-anchor="middle">1</text>

  <text class="group" x="24" y="318">BUILD</text>
  <text class="nav" x="28" y="344">Experts</text>
  <text class="nav" x="28" y="372">Workflows</text>
  <text class="nav" x="28" y="400">Tools</text>

  <text class="group" x="24" y="438">SYSTEM</text>
  <text class="nav" x="28" y="464">Operations</text>
  <text class="nav" x="28" y="492">Models</text>
  <text class="nav" x="28" y="520">Settings</text>

  <!-- Run header -->
  <text x="252" y="70" font-size="12" fill="#737373">Runs  /</text>
  <text x="252" y="100" font-size="21" font-weight="600" fill="#fafafa">Fix the flaky test and open a PR</text>
  <rect x="764" y="82" width="164" height="26" rx="13" fill="#ffb900"/>
  <text x="846" y="99.5" font-size="12" font-weight="600" fill="#1e170e" text-anchor="middle">Waiting for approval</text>
  <text class="mono" x="252" y="128" font-size="11.5" fill="#a1a1a1">Code maintainer · Terra · US$0.38 of US$1.50</text>
  <line x1="236" y1="148" x2="944" y2="148" stroke="#262626"/>

  <!-- Result, streaming -->
  <rect x="236.5" y="164.5" width="403" height="371" rx="12" fill="#171717" stroke="#262626"/>
  <text class="group" x="256" y="190">RESULT</text>
  <circle class="pulse" cx="318" cy="186" r="4" fill="#00bc7d"/>
  <text x="328" y="190" font-size="11" fill="#00bc7d">streaming</text>
  <text class="serif" x="256" y="226" font-size="18" fill="#fafafa">Flaky test fix</text>
  <text class="serif" x="256" y="256" font-size="14" fill="#d4d4d4">The test waited a fixed 200 ms for the</text>
  <text class="serif" x="256" y="278" font-size="14" fill="#d4d4d4">queue to drain. It now waits for the</text>
  <text class="serif" x="256" y="300" font-size="14" fill="#d4d4d4">drain event, with a five-second ceiling,</text>
  <text class="serif" x="256" y="322" font-size="14" fill="#d4d4d4">so a slow machine no longer fails it.</text>
  <rect x="256" y="342" width="312" height="9" rx="4.5" fill="#262626"/>
  <rect x="256" y="362" width="268" height="9" rx="4.5" fill="#262626"/>
  <rect x="256" y="382" width="184" height="9" rx="4.5" fill="#262626"/>
  <rect class="caret" x="446" y="379" width="2" height="15" fill="#2b7fff"/>
  <text class="group" x="256" y="430">FILES CHANGED</text>
  <text class="mono" x="256" y="456" font-size="12" fill="#e5e5e5">tests/test_queue.py</text>
  <text class="mono" x="620" y="456" font-size="12" fill="#00bc7d" text-anchor="end">+6</text>
  <text class="mono" x="256" y="480" font-size="12" fill="#e5e5e5">src/queue/drain.py</text>
  <text class="mono" x="620" y="480" font-size="12" fill="#00bc7d" text-anchor="end">+11</text>
  <text class="mono" x="256" y="512" font-size="11" fill="#737373">Illustration: names and numbers are examples.</text>

  <!-- Plan -->
  <rect x="656.5" y="164.5" width="287" height="195" rx="12" fill="#171717" stroke="#262626"/>
  <text class="group" x="676" y="190">PLAN</text>
  <circle cx="686" cy="218" r="9" fill="#00bc7d"/><path d="M682 218.5 l2.6 2.6 l5.2 -5.4" fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="704" y="222.5" font-size="13" fill="#e5e5e5">Read the failing test</text>
  <circle cx="686" cy="254" r="9" fill="#00bc7d"/><path d="M682 254.5 l2.6 2.6 l5.2 -5.4" fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="704" y="258.5" font-size="13" fill="#e5e5e5">Patch the fix</text>
  <circle class="pulse" cx="686" cy="290" r="9" fill="#ffb900"/>
  <text x="704" y="294.5" font-size="13" fill="#fafafa" font-weight="600">Open the pull request</text>
  <circle cx="686" cy="326" r="8" fill="none" stroke="#737373" stroke-width="1.5"/>
  <text x="704" y="330.5" font-size="13" fill="#a1a1a1">Record what was verified</text>

  <!-- Approval -->
  <rect x="656.75" y="376.75" width="286.5" height="158.5" rx="12" fill="#171717" stroke="#ffb900" stroke-opacity="0.7" stroke-width="1.5"/>
  <text class="group" x="676" y="402" fill="#ffb900">NEEDS YOU</text>
  <text x="676" y="430" font-size="15" font-weight="600" fill="#fafafa">Open pull request</text>
  <text class="mono" x="676" y="452" font-size="12" fill="#a1a1a1">fix/flaky-test → main · 2 files</text>
  <rect x="676" y="474" width="120" height="36" rx="8" fill="#193cb8"/>
  <text x="736" y="497" font-size="13" font-weight="600" fill="#eff6ff" text-anchor="middle">Approve  A</text>
  <rect x="806.5" y="474.5" width="117" height="35" rx="8" fill="#0a0a0a" stroke="#2e2e2e"/>
  <text x="865" y="497" font-size="13" font-weight="600" fill="#fafafa" text-anchor="middle">Decline  D</text>
</svg>
