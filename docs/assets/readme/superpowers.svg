<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" role="img" aria-labelledby="title desc">
  <title id="title">Autobots superpowers</title>
  <desc id="desc">Six tiles. Runs that survive: checkpointed in Postgres under a fenced lease. Spending you control: US$0.25 to US$5.00 per run under a daily cap, reserved before every call. Asks before it acts: approvals bound to exact arguments. 37 tools in 14 groups, each switchable. Experts and workflows: six Experts and four workflows. Local by design: loopback ports, encrypted keys, and only OpenRouter and granted tool calls leave the Mac.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #0a0a0a; --mfg: #737373; --line: #e5e5e5; --surface: #f5f5f5; --brand: #155dfc; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #171717; --fg: #fafafa; --mfg: #a1a1a1; --line: #333333; --surface: #262626; --brand: #2b7fff; }
    }
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: var(--mfg); }
    .tile { fill: var(--bg); stroke: var(--line); }
    .chip { fill: var(--brand); fill-opacity: 0.12; }
    .icon { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .title { fill: var(--fg); font-size: 18px; font-weight: 600; }
    .body { fill: var(--mfg); font-size: 13.5px; }
    .tag { fill: var(--surface); }
  </style>

  <!-- Runs that survive -->
  <g transform="translate(16 16)">
    <rect class="tile" x="0.5" y="0.5" width="295" height="247" rx="16"/>
    <rect class="chip" x="24" y="24" width="48" height="48" rx="12"/>
    <g class="icon" transform="translate(36 36)"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></g>
    <text class="title" x="24" y="104">Runs that survive</text>
    <text class="body" x="24" y="132">Each step is checkpointed in</text>
    <text class="body" x="24" y="152">Postgres under a fenced lease, so a</text>
    <text class="body" x="24" y="172">crash or a restart resumes the run.</text>
    <rect class="tag" x="24" y="196" width="228" height="26" rx="13"/>
    <text class="mono" x="38" y="213">leases · fencing · checkpoints</text>
  </g>

  <!-- Spending you control -->
  <g transform="translate(332 16)">
    <rect class="tile" x="0.5" y="0.5" width="295" height="247" rx="16"/>
    <rect class="chip" x="24" y="24" width="48" height="48" rx="12"/>
    <g class="icon" transform="translate(36 36)"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g>
    <text class="title" x="24" y="104">Spending you control</text>
    <text class="body" x="24" y="132">Pick US$0.25 to US$5.00 per run,</text>
    <text class="body" x="24" y="152">under a daily cap. Every model call</text>
    <text class="body" x="24" y="172">reserves its worst case first.</text>
    <rect class="tag" x="24" y="196" width="206" height="26" rx="13"/>
    <text class="mono" x="38" y="213">reserved before every call</text>
  </g>

  <!-- Asks before it acts -->
  <g transform="translate(648 16)">
    <rect class="tile" x="0.5" y="0.5" width="295" height="247" rx="16"/>
    <rect class="chip" x="24" y="24" width="48" height="48" rx="12"/>
    <g class="icon" transform="translate(36 36)"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
    <text class="title" x="24" y="104">Asks before it acts</text>
    <text class="body" x="24" y="132">Pull requests, issues and browsing</text>
    <text class="body" x="24" y="152">wait for you. Approval binds the</text>
    <text class="body" x="24" y="172">exact arguments you saw.</text>
    <rect class="tag" x="24" y="196" width="196" height="26" rx="13"/>
    <text class="mono" x="38" y="213">argument-bound approvals</text>
  </g>

  <!-- 37 tools -->
  <g transform="translate(16 280)">
    <rect class="tile" x="0.5" y="0.5" width="295" height="247" rx="16"/>
    <rect class="chip" x="24" y="24" width="48" height="48" rx="12"/>
    <g class="icon" transform="translate(36 36)"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></g>
    <text class="title" x="24" y="104">37 tools, 14 groups</text>
    <text class="body" x="24" y="132">Search with Jina, Tavily or Google,</text>
    <text class="body" x="24" y="152">read and crawl sites, use GitHub,</text>
    <text class="body" x="24" y="172">files, code, an isolated browser.</text>
    <rect class="tag" x="24" y="196" width="164" height="26" rx="13"/>
    <text class="mono" x="38" y="213">each one switchable</text>
  </g>

  <!-- Experts and workflows -->
  <g transform="translate(332 280)">
    <rect class="tile" x="0.5" y="0.5" width="295" height="247" rx="16"/>
    <rect class="chip" x="24" y="24" width="48" height="48" rx="12"/>
    <g class="icon" transform="translate(36 36)"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g>
    <text class="title" x="24" y="104">Experts and workflows</text>
    <text class="body" x="24" y="132">Six ready Experts and four</text>
    <text class="body" x="24" y="152">workflows. Hand work to specialists,</text>
    <text class="body" x="24" y="172">or run it on a schedule.</text>
    <rect class="tag" x="24" y="196" width="232" height="26" rx="13"/>
    <text class="mono" x="38" y="213">Research analyst · Google bot</text>
  </g>

  <!-- Local by design -->
  <g transform="translate(648 280)">
    <rect class="tile" x="0.5" y="0.5" width="295" height="247" rx="16"/>
    <rect class="chip" x="24" y="24" width="48" height="48" rx="12"/>
    <g class="icon" transform="translate(36 36)"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
    <text class="title" x="24" y="104">Local by design</text>
    <text class="body" x="24" y="132">Next.js, Python and Supabase run</text>
    <text class="body" x="24" y="152">on loopback ports, keys encrypted.</text>
    <text class="body" x="24" y="172">Only OpenRouter and tools go out.</text>
    <rect class="tag" x="24" y="196" width="206" height="26" rx="13"/>
    <text class="mono" x="38" y="213">OpenRouter-only inference</text>
  </g>
</svg>
