<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="tool-call-title tool-call-desc" id="tool-call-root"><title id="tool-call-title">Tool choice is not permission</title><desc id="tool-call-desc">The application offers only registered, granted tool schemas. The model returns a name and complete arguments. Middleware checks limits and the gateway checks schema, scope, ownership and any required approval before the Python handler runs. Validated, redacted output becomes a ToolMessage for the next model turn. This is the permitted path; a denial, pending approval or unknown outcome changes or stops it.</desc><defs>
      <style>#tool-call-root { --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.145 0 0);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.145 0 0);
  --primary: oklch(0.488 0.243 264.376);
  --primary-foreground: oklch(0.97 0.014 254.604);
  --secondary: oklch(0.967 0.001 286.375);
  --secondary-foreground: oklch(0.21 0.006 285.885);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --accent-foreground: oklch(0.205 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.708 0 0);
  --chart-1: oklch(0.845 0.143 164.978);
  --chart-2: oklch(0.696 0.17 162.48);
  --chart-3: oklch(0.596 0.145 163.225);
  --chart-4: oklch(0.508 0.118 165.612);
  --chart-5: oklch(0.432 0.095 166.913);
  --radius: 0.625rem;
  --sidebar: oklch(0.985 0 0);
  --sidebar-foreground: oklch(0.145 0 0);
  --sidebar-primary: oklch(0.546 0.245 262.881);
  --sidebar-primary-foreground: oklch(0.97 0.014 254.604);
  --sidebar-accent: oklch(0.97 0 0);
  --sidebar-accent-foreground: oklch(0.205 0 0);
  --sidebar-border: oklch(0.922 0 0);
  --sidebar-ring: oklch(0.708 0 0); }
      #tool-call-root { --paper:var(--background); --ink:var(--foreground); --soft:var(--muted-foreground); --focus:var(--primary); --font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --font-mono:ui-monospace,"SFMono-Regular",Consolas,monospace; --font-serif:Georgia,"Times New Roman",serif; }
      #tool-call-root { color: var(--ink); font-family: var(--font-sans); }
      #tool-call-root .diagram-container { width:100%; overflow-x:auto; }
      #tool-call-root .paper { fill:var(--paper); }
      #tool-call-root .node { fill:var(--paper); stroke:var(--soft); stroke-width:1; }
      #tool-call-root .focal { fill:var(--primary-foreground); stroke:var(--focus); stroke-width:1.5; }
      #tool-call-root .node-name { font-family:var(--font-sans); font-size:12px; font-weight:600; fill:var(--ink); text-anchor:middle; }
      #tool-call-root .sub { font-family:var(--font-mono); font-size:9px; fill:var(--soft); text-anchor:middle; }
      #tool-call-root .focal-sub { fill:var(--ink); }
      #tool-call-root .heading { font-family:var(--font-serif); font-size:28px; fill:var(--ink); }
      #tool-call-root .svg-eyebrow { font-family:var(--font-mono); font-size:8px; letter-spacing:1.2px; fill:var(--soft); }
      #tool-call-root .note { font-family:var(--font-sans); font-size:11px; fill:var(--soft); }
      #tool-call-root .label { font-family:var(--font-mono); font-size:8px; fill:var(--soft); text-anchor:middle; }
      #tool-call-root .edge { fill:none; stroke:var(--soft); stroke-width:1; }
      #tool-call-root .accent-edge { fill:none; stroke:var(--focus); stroke-width:1.5; }
      #tool-call-root .lifeline { fill:none; stroke:var(--border); stroke-width:1; stroke-dasharray:4 4; }
      #tool-call-root .return { stroke-dasharray:5 4; }
      #tool-call-root .rule { stroke:var(--border); stroke-width:1; }
      @media print {
#tool-call-root .diagram-container { overflow-x:visible; }
}</style><marker id="tool-call-tool-call-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--soft)"/></marker><marker id="tool-call-tool-call-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--focus)"/></marker><marker id="tool-call-tool-call-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--focus)"/></marker></defs><rect width="960" height="600" class="paper"/><text x="40" y="28" class="svg-eyebrow">AUTOBOTS / RUNTIME Q&amp;A</text><text x="40" y="64" class="heading">Tool choice is not permission</text><text x="40" y="88" class="note">The model selects an offered tool; the application authorizes execution.</text><line x1="160" y1="192" x2="160" y2="508" class="lifeline"/><line x1="480" y1="192" x2="480" y2="508" class="lifeline"/><line x1="800" y1="192" x2="800" y2="508" class="lifeline"/><path d="M 480 224 H 160" class="edge" marker-end="url(#tool-call-tool-call-arrow)"/><path d="M 160 280 H 480" class="accent-edge" marker-end="url(#tool-call-tool-call-accent)"/><path d="M 480 360 H 800" class="edge" marker-end="url(#tool-call-tool-call-arrow)"/><path d="M 800 416 H 480" class="edge return" marker-end="url(#tool-call-tool-call-arrow)"/><path d="M 480 480 H 160" class="edge return" marker-end="url(#tool-call-tool-call-arrow)"/><rect x="264" y="203" width="112" height="12" class="paper"/><text x="320" y="212" class="label">TOOL SCHEMAS</text><rect x="264" y="259" width="112" height="12" class="paper"/><text x="320" y="268" class="label">NAME + ARGS</text><rect x="584" y="339" width="112" height="12" class="paper"/><text x="640" y="348" class="label">ALLOWED CALL</text><rect x="580" y="395" width="120" height="12" class="paper"/><text x="640" y="404" class="label">HANDLER RESULT</text><rect x="264" y="459" width="112" height="12" class="paper"/><text x="320" y="468" class="label">TOOL MESSAGE</text><rect x="72" y="128" width="176" height="64" rx="6" class="node"/><text x="160" y="155" class="node-name">Model</text><text x="160" y="173" class="sub">proposes the action</text><rect x="392" y="128" width="176" height="64" rx="6" class="focal"/><text x="480" y="155" class="node-name">Application</text><text x="480" y="173" class="sub focal-sub">bounds + tool gateway</text><rect x="712" y="128" width="176" height="64" rx="6" class="node"/><text x="800" y="155" class="node-name">Python handler</text><text x="800" y="173" class="sub">performs the operation</text><text x="496" y="312" class="note">Check version, schema, paths, lease</text><text x="496" y="328" class="note">and approval; prepare effect receipt.</text><text x="496" y="440" class="note">Validate, redact and record result.</text><line x1="40" y1="552" x2="920" y2="552" class="rule"/><text x="40" y="576" class="note">Solid arrows: calls or offered schemas. Dashed arrows: results. A refusal or pending approval never runs the handler.</text></svg>
