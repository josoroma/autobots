[project]
name = "autobots"
version = "0.0.0"
description = "Autobots agent service: the API, the durable run worker and the domain behind them."
requires-python = "==3.12.*"
dependencies = [
  "cryptography==50.0.2",
  "deepagents==0.7.32",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "langchain==1.4.8",
  "langchain-mcp-adapters==0.3.2",
  "langchain-openrouter==0.2.9",
  "langgraph==1.2.19",
  "langgraph-checkpoint-postgres==3.2.0",
  "openrouter==0.11.46",
  "psycopg[binary]==3.3.8",
  "psycopg-pool==3.3.3",
  "pyjwt==2.15.1",
  "trafilatura==2.3.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.3",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.6"
# The editable install follows source edits by itself. Without this, editing `src` makes
# `uv sync --check` report an outdated environment, which is not dependency drift.
cache-keys = [{ file = "pyproject.toml" }]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# R-05: size, complexity and broad catches start at a baseline that only shrinks. A current
# offender carries a dated `noqa`, and RUF100 fails once that marker is no longer needed.
select = [
    "E", "F", "W", "I", "B", "UP", "ASYNC", "RUF",
    "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "BLE001", "S110", "S112", "DTZ", "S602", "S604", "S605", "FAST002", "FAST003",
    "ANN401", "TID251",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Owned code never imports the unused provider SDKs (user decision, 2026-11-05)."
"langchain_anthropic".msg = "Owned code never imports the unused provider SDKs (user decision, 2026-11-05)."
"google".msg = "Owned code never imports the unused provider SDKs (user decision, 2026-11-05)."
"langchain_google_genai".msg = "Owned code never imports the unused provider SDKs (user decision, 2026-11-05)."
"openai".msg = "Application inference is OpenRouter only (AGENTS.md)."
"langchain_openai".msg = "Application inference is OpenRouter only (AGENTS.md)."

# R-05: the Any baseline. api/ and domain/ start at zero; delete a file's line once it has no Any.
[tool.ruff.lint.per-file-ignores]
"src/autobots/adapters/loop_middleware.py" = ["ANN401"]
"src/autobots/adapters/models/openrouter_metadata.py" = ["ANN401"]
"src/autobots/adapters/object_storage.py" = ["ANN401"]
"src/autobots/adapters/result_stream.py" = ["ANN401"]
"src/autobots/application/browsing_loop.py" = ["ANN401"]
"src/autobots/application/compaction.py" = ["ANN401"]
"src/autobots/application/goal_loop.py" = ["ANN401"]
"src/autobots/application/worker_inference.py" = ["ANN401"]
"src/autobots/application/workflow_runner.py" = ["ANN401"]
"src/autobots/operations/browse_trial.py" = ["ANN401"]
"src/autobots/operations/concept_seed.py" = ["ANN401"]
"src/autobots/operations/reasoning_trial.py" = ["ANN401"]
"src/autobots/operations/route_qualification.py" = ["ANN401"]
"tests/test_browse_trial.py" = ["ANN401"]
"tests/test_browsing_loop.py" = ["ANN401"]
"tests/test_browsing_tool.py" = ["ANN401"]
"tests/test_contracts.py" = ["ANN401"]
"tests/test_execution_contract.py" = ["ANN401"]
"tests/test_github_issues.py" = ["ANN401"]
"tests/test_github_reads.py" = ["ANN401"]
"tests/test_model_attempts.py" = ["ANN401"]
"tests/test_operation_values.py" = ["ANN401"]
"tests/test_operations.py" = ["ANN401"]
"tests/test_readiness.py" = ["ANN401"]
"tests/test_reasoning_trial.py" = ["ANN401"]
"tests/test_result_stream.py" = ["ANN401"]
"tests/test_route_qualification.py" = ["ANN401"]
"tests/test_schema_release.py" = ["ANN401"]
"tests/test_tavily.py" = ["ANN401"]
"tests/test_tool_keys.py" = ["ANN401"]
"tests/test_worker_inference.py" = ["ANN401"]
"tests/test_workflow_execution.py" = ["ANN401"]
"tests/test_workflows.py" = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-returns = 8
max-statements = 60
max-args = 8

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
