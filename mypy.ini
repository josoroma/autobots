# R-07: strict typing for the hook's trust boundary, run from the repository root by repo_mypy.
# The service keeps its own configuration in services/agent/pyproject.toml.
[mypy]
python_version = 3.12
strict = True
mypy_path = scripts
files = .claude/hooks/dispatch.py, scripts/harness_lib.py, scripts/verify.py, scripts/specs.py, scripts/evidence.py, scripts/toolchain.py, scripts/qualification/, scripts/paid_run.py
