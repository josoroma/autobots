# R-07: the Python standard for scripts/, tests/ and .claude/hooks/, checked from the repository root.
# services/agent/pyproject.toml keeps its own configuration with the same rule families and its own
# ratchets: extending this file would also inherit its exclusion of services/.
target-version = "py312"
line-length = 100
extend-exclude = ["services", "research", "apps", "packages", "docs", "openspec", ".checks", "node_modules"]

[lint]
select = [
    "E", "F", "W", "I", "B", "UP", "ASYNC", "RUF",
    "BLE001", "S110", "S112", "DTZ", "S602", "S604", "S605", "TID251",
]

[lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Owned code never imports the unused provider SDKs (user decision, 2026-11-05)."
"langchain_anthropic".msg = "Owned code never imports the unused provider SDKs (user decision, 2026-11-05)."
"google".msg = "Owned code never imports the unused provider SDKs (user decision, 2026-11-05)."
"langchain_google_genai".msg = "Owned code never imports the unused provider SDKs (user decision, 2026-11-05)."
"openai".msg = "Application inference is OpenRouter only (AGENTS.md)."
"langchain_openai".msg = "Application inference is OpenRouter only (AGENTS.md)."

[lint.per-file-ignores]
# Deliberately broken fixtures that the fault qualification expects to fail.
"tests/faults/**" = ["ALL"]
# Repository Python isn't reformatted yet (Decision 0027 D8), so long lines wait for that.
"scripts/**" = ["E501"]
"tests/**" = ["E501"]
".claude/hooks/**" = ["E501"]
